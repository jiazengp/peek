plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'java'
	id "systems.manifold.manifold-gradle-plugin" version "0.0.2-alpha"
}

// Enhanced version properties loading with preprocessor support
def loadVersionProperties() {
	def projectProperties = gradle.startParameter.projectProperties
	def mcVer = projectProperties.get('mcVer')?.toString()
		?: gradle.ext.mcVer?.toString()
		?: projectProperties.get('minecraft_version')?.toString()
		?: project.findProperty('mcVer')?.toString()
		?: project.findProperty('minecraft_version')?.toString()
	def targetPropertiesFile = file("version_properties/${mcVer}.properties")
	if (!targetPropertiesFile.exists()) {
		def versionPropertiesDir = file("version_properties")
		def normalizedCandidate = versionPropertiesDir.exists()
			? versionPropertiesDir.listFiles().find { file ->
				file.name.endsWith('.properties') && file.name.replace('.properties', '') ==~ /^${java.util.regex.Pattern.quote(mcVer)}\.\d+(\.\d+)?$/
			}
			: null
		if (normalizedCandidate != null) {
			mcVer = normalizedCandidate.name.replace('.properties', '')
			targetPropertiesFile = normalizedCandidate
		}
	}
	
	def versionProperties = new Properties()
	if (targetPropertiesFile.exists()) {
		targetPropertiesFile.withInputStream { versionProperties.load(it) }
	} else {
		throw new GradleException("Version properties file not found for Minecraft ${mcVer}")
	}
	
	return versionProperties
}

def versionProperties = loadVersionProperties()
def compatibleVersionsRaw = versionProperties.getProperty("compatible_minecraft_versions", versionProperties.getProperty("minecraft_version"))
// Parse version list and use >= with minimum version for Fabric compatibility
def versionList = compatibleVersionsRaw.replaceAll('^\\["', '').replaceAll('"\\]$', '').split('","')
def minVersion = versionList.min { a, b ->
    def aParts = a.split('\\.').collect { it.toInteger() }
    def bParts = b.split('\\.').collect { it.toInteger() }
    for (int i = 0; i < Math.max(aParts.size(), bParts.size()); i++) {
        int aNum = i < aParts.size() ? aParts[i] : 0
        int bNum = i < bParts.size() ? bParts[i] : 0
        if (aNum != bNum) return aNum <=> bNum
    }
    return 0
}
def compatibleMinecraftVersions = ">=${minVersion}"
def compatibleVersions = versionProperties.getProperty("minecraft_version")

// Parse version components once for reuse
def parseVersionComponents(String version) {
	def parts = version.split('\\.')
	def isNewFormat = (parts.length == 2 && parts[0].toInteger() >= 20) ||
		(parts.length == 3 && parts[0].toInteger() >= 20)

	if (!isNewFormat) {
		throw new GradleException("Only Minecraft 26.x+ is supported by this branch: ${version}")
	}

	def major = parts[0]
	def minor = parts.length > 1 ? parts[1] : "0"
	def patch = parts.length > 2 ? parts[2] : "0"
	def formattedVersion = String.format("%02d%02d%01d", major.toInteger(), minor.toInteger(), patch.toInteger())

	return [
		major: major,
		minor: minor,
		patch: patch,
		full: version,
		formatted: formattedVersion,
		isNewFormat: isNewFormat
	]
}

def mcVersionInfo = parseVersionComponents(versionProperties.getProperty("minecraft_version"))

// Generate build.properties for preprocessor definitions (inspired by Fuji)
def writeBuildGradlePredefine(Properties versionProps, mcInfo) {
	def currentMcVer = versionProps.getProperty("minecraft_version")
	def buildPropsFile = file("build.properties")

	StringBuilder sb = new StringBuilder()
	sb.append("# Generated preprocessor definitions for Minecraft ${currentMcVer}\n")
	sb.append("# Generated at: ${new Date()}\n")
	sb.append("\n")

	// Version flags using parsed components
	sb.append("MC_VER=${mcInfo.formatted}\n")
	if (mcInfo.patch == "0") {
		sb.append("MC_${mcInfo.major}_${mcInfo.minor}=1\n")
	} else {
		sb.append("MC_${mcInfo.major}_${mcInfo.minor}_${mcInfo.patch}=1\n")
	}

	sb.append("MC_MAJOR=${mcInfo.major}\n")
	sb.append("MC_MINOR=${mcInfo.minor}\n")
	sb.append("MC_PATCH=${mcInfo.patch}\n")
	sb.append("MC_NEW_FORMAT=${mcInfo.isNewFormat ? 1 : 0}\n")

	// Set other version flags to 0 for conditional compilation
	def versionPropertiesDir = file("version_properties")
	if (versionPropertiesDir.exists()) {
		versionPropertiesDir.listFiles().each { file ->
			if (file.name.endsWith('.properties')) {
				def otherVersion = file.name.replace('.properties', '')
				if (otherVersion != currentMcVer) {
					def otherInfo = parseVersionComponents(otherVersion)
					if (otherInfo.patch == "0") {
						sb.append("MC_${otherInfo.major}_${otherInfo.minor}=0\n")
					} else {
						sb.append("MC_${otherInfo.major}_${otherInfo.minor}_${otherInfo.patch}=0\n")
					}
				}
			}
		}
	}

	buildPropsFile.text = sb.toString()
	println "Generated build.properties for Minecraft ${currentMcVer}"
}

// Generate preprocessor definitions before compilation
writeBuildGradlePredefine(versionProperties, mcVersionInfo)

// Manifold preprocessor configuration
manifold {
	manifoldVersion = "2025.1.29"
}

loom {
	noIntermediateMappings()
}

base {
	archivesName = project.archives_base_name
}

version = "${project.mod_version}+${compatibleVersions}"
group = project.maven_group

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		url = "https://maven.nucleoid.xyz/"
	}
}

dependencies {
	implementation platform("net.fabricmc.fabric-api:fabric-api-bom:${versionProperties.getProperty("fabric_version")}")

	minecraft "com.mojang:minecraft:${versionProperties.getProperty("minecraft_version")}"
	implementation "net.fabricmc:fabric-loader:${versionProperties.getProperty("fabric_loader_version")}"

	implementation "net.fabricmc.fabric-api:fabric-api:${versionProperties.getProperty("fabric_version")}"
	implementation include("eu.pb4:placeholder-api:${versionProperties.getProperty("placeholder_api_version")}")
	implementation include("xyz.nucleoid:server-translations-api:${versionProperties.getProperty("server_translations_api_version")}")
	implementation include("eu.pb4:player-data-api:${versionProperties.getProperty("player_data_api_version")}")
	implementation include("eu.pb4:common-protection-api:1.0.0")

	include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.5.0")))
	implementation include("me.lucko:fabric-permissions-api:${versionProperties.getProperty("fabric_permissions_api_version")}")

	include(implementation("de.exlll:configlib-core:4.6.1"))
	include(implementation("de.exlll:configlib-yaml:4.6.1"))
	include(implementation("org.snakeyaml:snakeyaml-engine:2.7"))
	
	// Manifold preprocessor for version compatibility (inspired by Fuji)
	annotationProcessor 'systems.manifold:manifold-preprocessor:2025.1.27'
	testAnnotationProcessor 'systems.manifold:manifold-preprocessor:2025.1.27'

	// Test dependencies
	testImplementation "net.fabricmc:fabric-loader-junit:${versionProperties.getProperty("fabric_loader_version")}"
	testImplementation "net.fabricmc.fabric-api:fabric-api:${versionProperties.getProperty("fabric_version")}"
	testImplementation "net.fabricmc:fabric-loader:${versionProperties.getProperty("fabric_loader_version")}"
}

def javaVersion = versionProperties.getProperty("java_version", "25").toInteger()

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

processResources {
	inputs.property "version", version
	inputs.property "minecraft_version", mcVersionInfo.full
	inputs.property "compatible_minecraft_versions", compatibleMinecraftVersions
	inputs.property "java_version", versionProperties.getProperty("java_version")
	inputs.property "fabricloader_version", versionProperties.getProperty("fabric_loader_version")
	inputs.property "fabric_loader_min_version", versionProperties.getProperty("fabric_loader_min_version")
	inputs.property "mc_ver_major", mcVersionInfo.major
	inputs.property "mc_ver_minor", mcVersionInfo.minor
	inputs.property "mc_ver_patch", mcVersionInfo.patch
	inputs.property "refmap_name", "peek.mixins.refmap.json"

	filesMatching("fabric.mod.json") {
		expand(
				"version": version,
				"java_version": versionProperties.getProperty("java_version"),
				"minecraft_version": mcVersionInfo.full,
				"compatible_minecraft_versions": compatibleMinecraftVersions,
				"fabric_loader_version": versionProperties.getProperty("fabric_loader_version"),
				"fabric_loader_min_version": versionProperties.getProperty("fabric_loader_min_version"),
				"mc_ver_major": mcVersionInfo.major,
				"mc_ver_minor": mcVersionInfo.minor,
				"mc_ver_patch": mcVersionInfo.patch
		)
	}
	
}

jar {
	inputs.property "archivesName", base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}


// Task to list available Minecraft versions
task listVersions {
	group = 'peek'
	description = 'List all available Minecraft versions for building'
	
	doLast {
		def versionPropertiesDir = file("version_properties")
		def availableVersions = []
		
		if (versionPropertiesDir.exists()) {
			versionPropertiesDir.listFiles().each { file ->
				if (file.name.endsWith('.properties')) {
					availableVersions.add(file.name.replace('.properties', ''))
				}
			}
		}
		
		// Sort versions (newest first)
		availableVersions.sort { a, b -> 
			def aParts = a.split('\\.')
			def bParts = b.split('\\.')
			for (int i = 0; i < Math.max(aParts.length, bParts.length); i++) {
				int aNum = i < aParts.length ? Integer.parseInt(aParts[i]) : 0
				int bNum = i < bParts.length ? Integer.parseInt(bParts[i]) : 0
				if (aNum != bNum) return bNum - aNum
			}
			return 0
		}
		
		println "Available Minecraft versions for building:"
		availableVersions.each { version ->
			println "  - ${version}"
		}
		println "\nTo build for a specific version: ./gradlew build -PmcVer=<version>"
		println "To build for all versions: ./buildAll.sh (Linux/Mac) or buildAll.bat (Windows)"
	}
}


